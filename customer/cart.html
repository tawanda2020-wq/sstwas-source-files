<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Basket - Self Service Till</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/customer.css" />
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen flex flex-col">

  <header class="flex items-center justify-between p-4">
    <a href="scanner.html" class="icon-circle w-9 h-9 bg-white card text-[#4A5568]"><i data-lucide="chevron-left" class="w-4 h-4"></i></a>
    <h1 class="font-semibold text-[#0D1B2A] text-sm">Your Basket</h1>
    <a href="../index.html" title="Home" class="icon-circle w-9 h-9 bg-white card text-[#4A5568]">
      <i data-lucide="house" class="w-4 h-4"></i>
    </a>
  </header>

  <div class="px-4 flex items-center justify-between">
    <p id="item-count" class="text-xs text-gray-400"></p>
    <button id="clear-cart-btn" class="hidden text-xs font-semibold text-[#D32F2F] flex items-center gap-1">
      <i data-lucide="trash-2" class="w-3 h-3"></i> Clear basket
    </button>
  </div>

  <main id="cart-list" class="flex-1 px-4 pt-2 space-y-3 overflow-y-auto stagger"></main>

  <div id="empty-state" class="hidden flex-1 flex flex-col items-center justify-center text-center px-6 animate-fade-up">
    <div class="icon-circle w-16 h-16 bg-[#EAF1FF] text-[#1A73E8] mx-auto mb-4"><i data-lucide="shopping-basket" class="w-7 h-7"></i></div>
    <p class="font-display italic text-xl text-[#0D1B2A] mb-1">Your basket is empty</p>
    <p class="text-sm text-[#4A5568] mb-5">Scan a QR code or search for a product to get started.</p>
    <a href="scanner.html" class="btn-primary px-6 py-3 flex items-center gap-2">
      <i data-lucide="scan-line" class="w-4 h-4"></i> Scan or Search
    </a>
  </div>

  <footer class="p-4 border-t border-gray-100 bg-white/80 backdrop-blur">
    <div class="flex justify-between text-base font-bold text-[#0D1B2A] mb-3">
      <span>Total</span>
      <span id="cart-total">$0.00</span>
    </div>
    <button id="checkout-btn" class="btn-primary w-full py-3.5 flex items-center justify-center gap-2">
      Proceed to Checkout <i data-lucide="arrow-right" class="w-4 h-4"></i>
    </button>
  </footer>

  <script type="module">
    import { getCart, removeItem, updateQty, getTotal, clearCart } from "../js/cart.js";
    import { syncSession, markSessionStatus, recordRemoval } from "../js/session.js";

    lucide.createIcons();

    function render() {
      const items = getCart();
      const listEl = document.getElementById("cart-list");
      const emptyEl = document.getElementById("empty-state");
      const checkoutBtn = document.getElementById("checkout-btn");
      const clearBtn = document.getElementById("clear-cart-btn");
      const countEl = document.getElementById("item-count");

      if (items.length === 0) {
        listEl.classList.add("hidden");
        emptyEl.classList.remove("hidden");
        checkoutBtn.disabled = true;
        checkoutBtn.classList.add("opacity-50");
        clearBtn.classList.add("hidden");
        countEl.textContent = "";
      } else {
        listEl.classList.remove("hidden");
        emptyEl.classList.add("hidden");
        checkoutBtn.disabled = false;
        checkoutBtn.classList.remove("opacity-50");
        clearBtn.classList.remove("hidden");
        const totalQty = items.reduce((s, i) => s + i.qty, 0);
        countEl.textContent = `${totalQty} item${totalQty === 1 ? "" : "s"} in your basket`;
      }

      listEl.innerHTML = items
        .map(
          (i) => `
        <div class="card p-3.5" data-id="${i.productId}">
          <div class="flex items-center justify-between gap-3">
            <div class="min-w-0">
              <p class="font-semibold text-[#0D1B2A] text-sm truncate">${i.name}</p>
              <p class="text-xs text-gray-400">$${i.unitPrice.toFixed(2)} each ${i.stock != null ? "&middot; " + i.stock + " in stock" : ""}</p>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              <button class="qty-minus icon-circle w-7 h-7 bg-gray-100 font-bold text-[#0D1B2A]">&minus;</button>
              <span class="w-6 text-center text-sm font-semibold">${i.qty}</span>
              <button class="qty-plus icon-circle w-7 h-7 bg-gray-100 font-bold text-[#0D1B2A] ${i.qty >= (i.stock || 999) ? "opacity-30 cursor-not-allowed" : ""}">+</button>
            </div>
          </div>
          <div class="flex items-center justify-between mt-2 pt-2 border-t border-gray-50">
            <button class="remove-btn text-xs text-[#D32F2F] font-semibold flex items-center gap-1">
              <i data-lucide="trash-2" class="w-3 h-3"></i> Remove
            </button>
            <span class="font-bold text-sm text-[#1A73E8]">$${(i.qty * i.unitPrice).toFixed(2)}</span>
          </div>
          <p class="stock-warn hidden text-[10px] text-[#D32F2F] mt-1">Only ${i.stock} unit(s) available — cannot add more.</p>
        </div>`
        )
        .join("");

      document.getElementById("cart-total").textContent = `$${getTotal().toFixed(2)}`;
      lucide.createIcons();

      listEl.querySelectorAll("[data-id]").forEach((row) => {
        const id = row.dataset.id;
        const item = items.find((i) => i.productId === id);
        row.querySelector(".qty-minus").addEventListener("click", () => {
          const goingToZero = item.qty - 1 <= 0;
          updateQty(id, item.qty - 1);
          if (goingToZero) recordRemoval(id, item.name);
          syncSession(getCart(), getTotal());
          render();
        });
        row.querySelector(".qty-plus").addEventListener("click", () => {
          const maxStock = item.stock || 999;
          if (item.qty >= maxStock) {
            const warn = row.querySelector(".stock-warn");
            if (warn) { warn.classList.remove("hidden"); setTimeout(() => warn.classList.add("hidden"), 2000); }
            return;
          }
          updateQty(id, item.qty + 1);
          syncSession(getCart(), getTotal());
          render();
        });
        row.querySelector(".remove-btn").addEventListener("click", () => {
          removeItem(id);
          recordRemoval(id, item.name);
          syncSession(getCart(), getTotal());
          render();
        });
      });
    }

    document.getElementById("clear-cart-btn").addEventListener("click", () => {
      if (!confirm("Remove all items from your basket?")) return;
      clearCart();
      markSessionStatus("active", { items: [], itemCount: 0, total: 0 });
      render();
    });

    document.getElementById("checkout-btn").addEventListener("click", async () => {
      await markSessionStatus("checkout");
      window.location.href = "checkout.html";
    });

    render();
  </script>
</body>
</html>
