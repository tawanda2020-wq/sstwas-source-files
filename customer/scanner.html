<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scan or Search - Self Service Till</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/customer.css" />
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body class="min-h-screen flex flex-col pb-24">

  <header class="flex items-center justify-between p-4 sticky top-0 bg-[#F7F9FC]/90 backdrop-blur z-20">
    <a href="index.html" class="icon-circle w-9 h-9 bg-white card text-[#4A5568]"><i data-lucide="chevron-left" class="w-4 h-4"></i></a>
    <h1 class="font-semibold text-[#0D1B2A] text-sm">Scan or Search</h1>
    <div class="flex items-center gap-2">
      <button id="torch-btn" class="icon-circle w-9 h-9 bg-white card text-[#4A5568]" title="Toggle torch"><i data-lucide="flashlight" class="w-4 h-4"></i></button>
      <a href="../index.html" title="Home" class="icon-circle w-9 h-9 bg-white card text-[#4A5568]">
        <i data-lucide="house" class="w-4 h-4"></i>
      </a>
    </div>
  </header>

  <!-- Search bar — always available, switches the view between camera and results -->
  <section class="px-4 mt-1 animate-fade-up">
    <div class="card flex items-center gap-2 px-4 py-3">
      <i data-lucide="search" class="w-4 h-4 text-gray-400"></i>
      <input id="search-input" type="text" placeholder="Search for any product in stock…"
        class="flex-1 text-sm outline-none bg-transparent placeholder:text-gray-400" autocomplete="off" />
      <button id="clear-search-btn" class="hidden text-gray-400"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
  </section>

  <!-- ===================== SCANNER VIEW (default) ===================== -->
  <div id="scanner-view">
    <section id="scan-section" class="px-4 mt-4">
      <div id="qr-reader" class="w-full"></div>
      <p id="scan-prompt" class="text-center text-sm text-[#4A5568] mt-3 flex items-center justify-center gap-1.5">
        <i data-lucide="scan-line" class="w-3.5 h-3.5"></i> Point your camera at a product's QR code
      </p>
      <div id="scan-error" class="hidden mt-3 card p-4 text-center text-[#D32F2F] text-sm"></div>
    </section>

    <!-- Product confirmed card (hidden until a valid scan) -->
    <section id="product-section" class="hidden px-4 mt-4 animate-pop">
      <div class="card p-5">
        <img id="product-image" src="" alt="" class="w-full h-40 object-cover rounded-xl mb-3 bg-gray-100" />
        <h2 id="product-name" class="text-lg font-bold text-[#0D1B2A]"></h2>
        <div class="flex items-center justify-between mt-1">
          <span id="product-price" class="text-[#1A73E8] font-bold text-base"></span>
          <span id="product-stock" class="text-xs font-semibold px-2 py-0.5 rounded-full"></span>
        </div>

        <div class="flex items-center justify-center gap-4 my-5">
          <button id="qty-minus" class="w-10 h-10 rounded-full bg-gray-100 text-xl font-bold">&minus;</button>
          <span id="qty-value" class="text-xl font-bold w-8 text-center">1</span>
          <button id="qty-plus" class="w-10 h-10 rounded-full bg-gray-100 text-xl font-bold">+</button>
        </div>

        <button id="add-cart-btn" class="btn-primary w-full py-3 flex items-center justify-center gap-2">
          <i data-lucide="shopping-cart" class="w-4 h-4"></i> Add to Cart
        </button>
        <button id="scan-next-btn" class="w-full py-3 mt-2 text-sm font-semibold text-[#4A5568]">Scan Next Item</button>
      </div>
    </section>
  </div>

  <!-- ===================== SEARCH RESULTS VIEW ===================== -->
  <div id="search-view" class="hidden px-4 mt-4">
    <p id="search-meta" class="text-xs text-gray-400 mb-3"></p>
    <div id="search-results" class="grid grid-cols-2 gap-3 stagger"></div>
    <div id="search-empty" class="hidden flex-col items-center text-center py-16">
      <div class="icon-circle w-12 h-12 bg-gray-100 text-gray-400 mx-auto mb-3"><i data-lucide="package-search" class="w-5 h-5"></i></div>
      <p class="text-sm text-[#4A5568] font-semibold">No matching products</p>
      <p class="text-xs text-gray-400 mt-1">Try a different name, or scan the item's QR code instead.</p>
    </div>
  </div>

  <!-- Floating basket bar -->
  <footer class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] p-4">
    <a href="cart.html" id="basket-bar" class="card flex items-center justify-between px-5 py-3.5 shadow-lg">
      <span class="flex items-center gap-2 text-sm font-semibold text-[#0D1B2A]">
        <span class="relative">
          <i data-lucide="shopping-basket" class="w-5 h-5"></i>
          <span id="basket-count" class="hidden absolute -top-2 -right-2 bg-[#1A73E8] text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
        </span>
        View Basket
      </span>
      <span id="basket-total" class="font-bold text-[#1A73E8]">$0.00</span>
    </a>
  </footer>

  <script type="module">
    import { getProduct, subscribeProducts } from "../js/db.js";
    import { addItem, getCart, getTotal } from "../js/cart.js";
    import { startScanner, stopScanner, toggleTorch } from "../js/scanner.js";
    import { syncSession, recordAddition } from "../js/session.js";

    lucide.createIcons();

    const scanSection = document.getElementById("scan-section");
    const productSection = document.getElementById("product-section");
    const errorBox = document.getElementById("scan-error");
    const scannerView = document.getElementById("scanner-view");
    const searchView = document.getElementById("search-view");
    const searchInput = document.getElementById("search-input");
    let currentProduct = null;
    let qty = 1;
    let torchOn = false;
    let allProducts = [];

    function refreshBasketBar() {
      const items = getCart();
      const count = items.reduce((s, i) => s + i.qty, 0);
      const countEl = document.getElementById("basket-count");
      document.getElementById("basket-total").textContent = `$${getTotal().toFixed(2)}`;
      if (count > 0) {
        countEl.textContent = count;
        countEl.classList.remove("hidden");
      } else {
        countEl.classList.add("hidden");
      }
    }
    refreshBasketBar();

    /* ---------------------- Camera scan flow ---------------------- */

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.remove("hidden");
      setTimeout(() => errorBox.classList.add("hidden"), 2500);
    }

    function showProductCard(product) {
      currentProduct = product;
      qty = 1;
      document.getElementById("qty-value").textContent = qty;
      document.getElementById("product-image").src = product.imageUrl || "../assets/icons/placeholder.png";
      document.getElementById("product-name").textContent = product.name;
      document.getElementById("product-price").textContent = `$${Number(product.price).toFixed(2)}`;
      const stockBadge = document.getElementById("product-stock");
      stockBadge.textContent = `${product.stock} in stock`;
      stockBadge.className = "text-xs font-semibold px-2 py-0.5 rounded-full " +
        (product.stock > 10 ? "bg-green-100 text-[#00C853]" : product.stock > 0 ? "bg-amber-100 text-[#FF8F00]" : "bg-red-100 text-[#D32F2F]");

      scanSection.classList.add("hidden");
      productSection.classList.remove("hidden");
      lucide.createIcons();
    }

    async function handleScan(decodedText) {
      const prompt = document.getElementById("scan-prompt");
      const originalPrompt = prompt.innerHTML;
      prompt.innerHTML = `<svg class="inline w-4 h-4 mr-1 animate-spin" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/></svg>Checking product…`;

      try {
        const product = await getProduct(decodedText);
        if (!product) {
          prompt.innerHTML = originalPrompt;
          return showError("Product not recognised - this item does not belong to this store.");
        }
        if (product.active === false) {
          prompt.innerHTML = originalPrompt;
          return showError("This product is currently unavailable.");
        }
        if (product.stock === 0) {
          prompt.innerHTML = originalPrompt;
          return showError("Out of stock - please inform a staff member.");
        }
        prompt.innerHTML = originalPrompt;
        showProductCard(product);
      } catch (err) {
        prompt.innerHTML = originalPrompt;
        showError("Could not reach the database. Check your connection and try again.");
      }
    }

    startScanner("qr-reader", handleScan, () => {}).catch((err) => {
      showError("Camera access denied or unavailable.");
      console.error(err);
    });

    document.getElementById("torch-btn").addEventListener("click", async () => {
      torchOn = !torchOn;
      await toggleTorch(torchOn);
    });

    document.getElementById("qty-minus").addEventListener("click", () => {
      qty = Math.max(1, qty - 1);
      document.getElementById("qty-value").textContent = qty;
    });
    document.getElementById("qty-plus").addEventListener("click", () => {
      qty = Math.min(currentProduct.stock, qty + 1);
      document.getElementById("qty-value").textContent = qty;
    });

    document.getElementById("add-cart-btn").addEventListener("click", async () => {
      addItem(currentProduct, qty);
      await Promise.all([
        recordAddition(currentProduct.id, currentProduct.name, true),
        syncSession(getCart(), getTotal())
      ]);
      window.location.href = "cart.html";
    });

    document.getElementById("scan-next-btn").addEventListener("click", () => {
      productSection.classList.add("hidden");
      scanSection.classList.remove("hidden");
    });

    window.addEventListener("beforeunload", () => stopScanner());

    /* --------------------------- Search flow --------------------------- */

    subscribeProducts((products) => {
      allProducts = products;
      if (searchInput.value.trim()) renderSearchResults(searchInput.value.trim());
    });

    function productCard(p) {
      const inCart = getCart().find((i) => i.productId === p.id);
      const disabled = p.active === false || p.stock === 0;
      const stockLabel = p.stock === 0 ? "Out of stock" : p.stock <= 10 ? `${p.stock} left` : "In stock";
      const stockClass = p.stock === 0 ? "text-[#D32F2F]" : p.stock <= 10 ? "text-[#FF8F00]" : "text-[#00C853]";
      return `
        <div class="card p-3 flex flex-col" data-id="${p.id}">
          <div class="w-full h-20 rounded-lg bg-gray-100 mb-2 bg-cover bg-center" style="background-image:url('${p.imageUrl || "../assets/icons/placeholder.png"}')"></div>
          <p class="text-xs font-semibold text-[#0D1B2A] leading-tight line-clamp-2">${p.name}</p>
          <p class="text-[10px] ${stockClass} mb-1.5">${stockLabel}</p>
          <div class="flex items-center justify-between mt-auto">
            <span class="text-sm font-bold text-[#1A73E8]">$${Number(p.price).toFixed(2)}</span>
            <button class="add-search-btn icon-circle w-7 h-7 ${disabled ? 'bg-gray-100 text-gray-300' : 'bg-[#1A73E8] text-white'}" data-id="${p.id}" ${disabled ? "disabled" : ""}>
              <i data-lucide="${inCart ? 'check' : 'plus'}" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        </div>`;
    }

    function renderSearchResults(term) {
      const matches = allProducts.filter(
        (p) => p.active !== false && p.name.toLowerCase().includes(term.toLowerCase())
      );
      const resultsEl = document.getElementById("search-results");
      const emptyEl = document.getElementById("search-empty");
      document.getElementById("search-meta").textContent =
        matches.length > 0 ? `${matches.length} product${matches.length === 1 ? "" : "s"} found` : "";

      if (matches.length === 0) {
        resultsEl.innerHTML = "";
        resultsEl.classList.add("hidden");
        emptyEl.classList.remove("hidden");
        emptyEl.classList.add("flex");
        return;
      }
      resultsEl.classList.remove("hidden");
      emptyEl.classList.add("hidden");
      emptyEl.classList.remove("flex");
      resultsEl.innerHTML = matches.map(productCard).join("");
      lucide.createIcons();

      resultsEl.querySelectorAll(".add-search-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const product = allProducts.find((p) => p.id === btn.dataset.id);
          if (!product || product.stock === 0) return;
          addItem(product, 1);
          recordAddition(product.id, product.name, false);
          syncSession(getCart(), getTotal());
          refreshBasketBar();
          btn.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5"></i>`;
          lucide.createIcons();
          btn.classList.add("animate-pop");
        });
      });
    }

    function setView(query) {
      if (query) {
        scannerView.classList.add("hidden");
        searchView.classList.remove("hidden");
        document.getElementById("clear-search-btn").classList.remove("hidden");
        renderSearchResults(query);
      } else {
        searchView.classList.add("hidden");
        scannerView.classList.remove("hidden");
        document.getElementById("clear-search-btn").classList.add("hidden");
      }
    }

    searchInput.addEventListener("input", (e) => setView(e.target.value.trim()));
    document.getElementById("clear-search-btn").addEventListener("click", () => {
      searchInput.value = "";
      setView("");
      searchInput.focus();
    });
  </script>
</body>
</html>
