<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page Not Found - Self Service Till</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body{
    font-family:'Inter',system-ui,sans-serif;
    background: radial-gradient(circle at 50% 0%, #EAF1FF 0%, rgba(234,241,255,0) 50%), #F7F9FC;
  }
  .font-display{font-family:'Fraunces',Georgia,serif;font-style:italic}
  @keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
  .animate-fade-up{animation:fadeUp .5s cubic-bezier(.22,.9,.3,1) both}
  .btn-primary {
    background: linear-gradient(135deg, #1E88F0 0%, #1A73E8 45%, #0D5FC9 100%);
    box-shadow: 0 10px 24px rgba(26,115,232,0.32);
  }
</style>
</head>
<body class="min-h-screen flex items-center justify-center text-center p-6">
  <div class="animate-fade-up">
    <div class="w-16 h-16 rounded-full bg-[#EAF1FF] text-[#1A73E8] flex items-center justify-center mx-auto mb-4">
      <i data-lucide="compass" class="w-7 h-7"></i>
    </div>
    <h1 class="font-display text-2xl text-[#0D1B2A] mb-2">Page not found</h1>
    <p class="text-sm text-[#4A5568] mb-6">The page you're looking for doesn't exist.</p>
    <a href="/" class="btn-primary text-white font-semibold px-6 py-3 rounded-xl inline-flex items-center gap-2">
      <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Home
    </a>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
