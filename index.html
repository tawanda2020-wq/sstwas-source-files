<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Self Service Till</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background:
      radial-gradient(circle at 10% -10%, #E8F7F0 0%, rgba(232,247,240,0) 55%),
      radial-gradient(circle at 100% 0%, #EAF1FF 0%, rgba(234,241,255,0) 50%),
      linear-gradient(180deg, #FDFEFE 0%, #F7F9FC 100%);
    min-height: 100vh;
  }
  .font-display { font-family: 'Fraunces', Georgia, serif; font-style: italic; }
  .role-card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 2px 14px rgba(13,27,42,0.06);
    border: 1px solid rgba(13,27,42,0.05);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .role-card:hover { transform: translateY(-3px); box-shadow: 0 14px 32px rgba(13,27,42,0.12); }
  .role-card:active { transform: scale(0.98); }
  .btn-primary {
    background: linear-gradient(135deg, #1E88F0 0%, #1A73E8 45%, #0D5FC9 100%);
    box-shadow: 0 10px 24px rgba(26,115,232,0.32);
  }
  @keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
  .animate-fade-up{animation:fadeUp .5s cubic-bezier(.22,.9,.3,1) both}
  .stagger > * { animation: fadeUp .45s cubic-bezier(.22,.9,.3,1) both; }
  .stagger > *:nth-child(1){animation-delay:.05s}
  .stagger > *:nth-child(2){animation-delay:.1s}
  .stagger > *:nth-child(3){animation-delay:.15s}
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
  <div class="max-w-sm w-full text-center animate-fade-up">
    <img src="assets/logo.png" alt="Store logo" class="h-14 mx-auto mb-4" onerror="this.style.display='none'" />
    <h1 class="font-display text-3xl text-[#0D1B2A] mb-2">Self Service Till</h1>
    <p class="text-sm text-[#4A5568] mb-10">Scan. Search. Pay. Choose how you'd like to continue.</p>

    <div class="space-y-3 stagger">
      <a href="customer/index.html" class="role-card flex items-center gap-4 p-4 text-left">
        <span class="w-11 h-11 rounded-full bg-[#EAF1FF] text-[#1A73E8] flex items-center justify-center shrink-0"><i data-lucide="shopping-basket" class="w-5 h-5"></i></span>
        <span class="flex-1">
          <span class="block font-bold text-[#0D1B2A] text-sm">I'm a Customer</span>
          <span class="block text-xs text-gray-400">Start shopping</span>
        </span>
        <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
      </a>
      <a href="cashier/login.html" class="role-card flex items-center gap-4 p-4 text-left">
        <span class="w-11 h-11 rounded-full bg-[#FFF4E5] text-[#FF8F00] flex items-center justify-center shrink-0"><i data-lucide="receipt" class="w-5 h-5"></i></span>
        <span class="flex-1">
          <span class="block font-bold text-[#0D1B2A] text-sm">Cashier</span>
          <span class="block text-xs text-gray-400">Sign in to the till</span>
        </span>
        <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
      </a>
      <a href="admin/login.html" class="role-card flex items-center gap-4 p-4 text-left">
        <span class="w-11 h-11 rounded-full bg-[#E6F9EE] text-[#00C853] flex items-center justify-center shrink-0"><i data-lucide="shield" class="w-5 h-5"></i></span>
        <span class="flex-1">
          <span class="block font-bold text-[#0D1B2A] text-sm">Admin</span>
          <span class="block text-xs text-gray-400">Manage the store</span>
        </span>
        <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
      </a>
    </div>

    <p class="text-xs text-gray-300 mt-10">SSTWAS &middot; Self Service Till Web App System</p>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
